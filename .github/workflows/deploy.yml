name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/opportunity-system-mockup-w3SiR]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build
        env:
          VITE_GAS_URL: https://script.google.com/macros/s/AKfycbzXN-IJ_abXI5fQDZMphU-SUM6w3lpMO0TI8y-xq9ql1BAPsmdF9Bou_tWreF-QfIId/exec

      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
